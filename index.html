
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kJ to Calories</title>
  <style>
    :root {
      --bg1: #ff9a8b;
      --bg2: #ff6a88;
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #777;
      --accent: #ff4f79;
      --field: #f4f4f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #2b1055;
        --bg2: #7597de;
        --card: #1e1e26;
        --text: #f2f2f2;
        --muted: #aaa;
        --field: #2c2c38;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
    }
    .card {
      background: var(--card);
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 1.6em; }
    .sub { margin: 0 0 24px; color: var(--muted); font-size: 0.95em; }
    label { display: block; text-align: left; font-size: 0.85em; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%;
      font-size: 1.5em;
      padding: 14px;
      border: 2px solid transparent;
      border-radius: 14px;
      background: var(--field);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    button {
      margin: 18px 0;
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-size: 0.95em;
      cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    .result-box { background: var(--field); border-radius: 14px; padding: 18px; min-height: 90px; }
    #result { font-size: 2.2em; font-weight: 700; color: var(--accent); }
    #unit { color: var(--muted); font-size: 0.95em; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>kJ ⇄ Calories</h1>
    <p class="sub">Quick energy converter</p>

    <label id="inLabel" for="value">Kilojoules (kJ)</label>
    <input id="value" type="number" inputmode="decimal" placeholder="0">

    <button id="swap">⇅ Swap direction</button>

    <div class="result-box">
      <div id="result">–</div>
      <div id="unit">Calories (kcal)</div>
    </div>
  </div>

  <script>
    const KJ_PER_KCAL = 4.184;
    let kjToKcal = true;

    const input = document.getElementById("value");
    const result = document.getElementById("result");
    const unit = document.getElementById("unit");
    const inLabel = document.getElementById("inLabel");

    function update() {
      const v = parseFloat(input.value);
      if (isNaN(v)) { result.textContent = "–"; return; }
      const out = kjToKcal ? v / KJ_PER_KCAL : v * KJ_PER_KCAL;
      result.textContent = out.toFixed(1);
    }

    document.getElementById("swap").addEventListener("click", () => {
      kjToKcal = !kjToKcal;
      inLabel.textContent = kjToKcal ? "Kilojoules (kJ)" : "Calories (kcal)";
      unit.textContent = kjToKcal ? "Calories (kcal)" : "Kilojoules (kJ)";
      update();
    });

    input.addEventListener("input", update);
  </script>
</body>
</html>
